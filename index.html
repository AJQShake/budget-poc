<!DOCTYPE html>
<html lang="en" data-theme="oiche">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111217">
<title>Dúchas · Family Planning</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<script src="cloud.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">
<style>
/* ============ Themes ============ */
:root{--r:16px;--r-sm:10px}
html[data-theme=cois]{--bg:#FAF9F6;--panel:#FFFFFF;--panel2:#F5F2EB;--border:#E7E2D8;--text:#1E293B;--muted:#64748B;--accent:#4E8B6E;--accent-ink:#fff;--accent2:#2A7B88;--good:#3D8B5F;--warn:#C98A1B;--bad:#B55D68;--grid:#E2E8F0;--shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.05);color-scheme:light}
html[data-theme=fomhar]{--bg:#F6EFE4;--panel:#FFFCF7;--panel2:#F0E4D2;--border:#E3D3BC;--text:#3A2E26;--muted:#87705D;--accent:#C0623B;--accent-ink:#fff;--accent2:#4F7489;--good:#5B8C51;--warn:#C9851F;--bad:#B0413E;--grid:#E9DCC9;--shadow:0 1px 2px rgba(58,46,38,.05),0 6px 18px rgba(58,46,38,.06);color-scheme:light}
html[data-theme=oiche]{--bg:#111217;--panel:#181B1F;--panel2:#22252B;--border:#2A2E35;--text:#D8D9DE;--muted:#8E919B;--accent:#FF9830;--accent-ink:#111217;--accent2:#5794F2;--good:#73BF69;--warn:#F2CC0C;--bad:#F2495C;--grid:#262A31;--shadow:none;color-scheme:dark}
html[data-theme=duibheagan]{--bg:#0B1622;--panel:#102031;--panel2:#162C43;--border:#1E3A55;--text:#E3EEF7;--muted:#8BA3B8;--accent:#2EC4B6;--accent-ink:#06201d;--accent2:#7AA2F7;--good:#4ADE80;--warn:#FBBF24;--bad:#F87171;--grid:#1A3149;--shadow:0 6px 18px rgba(0,0,0,.25);color-scheme:dark}

/* ============ Base ============ */
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent2)}
h1,h2,h3,h4{margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11px}.b{font-weight:600}
.t-good{color:var(--good)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}.t-acc{color:var(--accent)}
.grow{flex:1;min-width:0}.right{text-align:right}.nowrap{white-space:nowrap}
.row-flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.faded{opacity:.55}
.pre{white-space:pre-wrap}

/* ============ Layout ============ */
#app{display:flex;min-height:100vh}
#sidenav{width:236px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:750;font-size:21px;letter-spacing:-.01em}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:19px;flex-shrink:0}
.brand .tag{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
.nav-a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;position:relative;cursor:pointer}
.nav-a:hover{background:var(--panel2);color:var(--text)}
.nav-a.on{background:var(--panel2);color:var(--text)}
.nav-a.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.nav-a .ga{display:block;font-weight:600;font-size:14px}.nav-a .en{display:block;font-size:11px;opacity:.8}
.nav-ic{width:24px;text-align:center;font-size:18px}
.nav-n{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:600}
.nav-foot{margin-top:auto;padding:10px;font-size:11px;color:var(--muted)}
#main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:9px 20px;display:flex;align-items:center;gap:10px;min-height:56px}
#topbar .mob-brand{display:none;font-weight:750;font-size:18px;align-items:center;gap:8px}
#topbar .mob-brand .logo{width:30px;height:30px;font-size:16px;border-radius:9px}
#view{padding:22px;max-width:1320px;width:100%;margin:0 auto;padding-bottom:110px}
#bottomnav{display:none}
@media(max-width:899px){
  #sidenav{display:none}
  #topbar{padding:8px 12px}
  #topbar .mob-brand{display:flex}
  #view{padding:14px 12px 110px}
  #bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  #bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:10.5px;position:relative;cursor:pointer}
  #bottomnav a .nav-ic{font-size:20px}
  #bottomnav a.on{color:var(--text);background:var(--panel2)}
  #bottomnav .nav-n{position:absolute;top:2px;right:18%;font-size:10px;padding:0 5px}
  .hide-mob{display:none!important}
}

/* ============ Components ============ */
.sec-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
.sec-h h1{font-size:26px;font-weight:750;letter-spacing:-.02em}
.sec-h .en{color:var(--muted);font-size:13px;margin-top:2px}
.sec-h .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.stack>*+*{margin-top:16px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:650}
.card-h .en{color:var(--muted);font-size:12px;font-weight:400}
.card-h .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media(max-width:1099px){.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:699px){.grid-2{grid-template-columns:minmax(0,1fr)}.grid{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
@media(max-width:600px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){.tile .val{font-size:21px}.tile{padding:12px}}
.tile .foot{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;transition:filter .15s,transform .05s;text-decoration:none}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.xs{padding:2px 8px;font-size:11.5px;border-radius:7px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;padding:4px 7px;border-radius:8px}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 4px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);color:color-mix(in srgb,var(--c,var(--accent)) 70%,var(--text));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 30%,transparent);white-space:nowrap;vertical-align:middle}
.chip.plain{padding:1px 8px}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--panel));border:2px solid var(--c);font-size:15px;flex-shrink:0;line-height:1;vertical-align:middle}
.av.lg{width:64px;height:64px;font-size:34px;border-width:3px}
.av.sm{width:22px;height:22px;font-size:12px;border-width:1.5px}
.avs{display:inline-flex;flex-shrink:0}.avs .av+.av{margin-left:-7px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st-on,.st-good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.st-risk,.st-warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.st-off,.st-bad,.st-overdue{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.st-done{background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--accent2)}
.st-neutral{background:var(--panel2);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.good{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 25%,transparent)}
.pbar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;position:relative;margin:4px 0}
.pbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c,var(--accent));transition:width .5s}
.pbar>i.ghost{opacity:.3}
.pbar.lg{height:12px}
.pbar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.55}
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:none}
.lrow .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.lrow .meta{font-size:12px;color:var(--muted)}
.lrow .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lrow.click{cursor:pointer;color:inherit;text-decoration:none}.lrow.click:hover{background:var(--panel2);border-radius:10px}
.cat-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-size:18px;background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent)}
.grp-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:16px 4px 4px}
.grp-h:first-child{margin-top:0}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px;margin-bottom:16px;overflow-x:auto;border:1px solid var(--border)}
.tabs a{padding:7px 13px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer}
.tabs a.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.tabs a .n{font-size:11px;opacity:.7;margin-left:3px}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:6px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);margin-bottom:16px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));flex-wrap:wrap}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
.banner .big{font-size:28px}
.greet{display:flex;align-items:center;gap:14px;margin:0 0 18px;flex-wrap:wrap}
.greet h1{font-size:26px;font-weight:750;letter-spacing:-.02em}
.greet .motto{color:var(--muted);font-size:13px;font-style:italic}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;cursor:pointer;flex-shrink:0;background:transparent;font-size:13px;color:transparent;padding:0}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.step-done .ttl{text-decoration:line-through;opacity:.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.goal-card{cursor:pointer;transition:border-color .15s;display:flex;flex-direction:column;gap:10px}
.goal-card:hover{border-color:var(--accent)}
.g-ic{font-size:26px;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--panel2);flex-shrink:0}
.g-ic.sm{width:36px;height:36px;font-size:19px;border-radius:11px}
.goal-card h3{font-size:16px;font-weight:650}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.lb-row .rank{width:22px;font-weight:700;color:var(--muted);text-align:center}
.lb-row .pts{font-weight:750;font-size:18px;font-variant-numeric:tabular-nums}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.bdg{border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;background:var(--panel2)}
.bdg .e{font-size:30px}.bdg .n{font-weight:650;font-size:13px;margin-top:4px}.bdg .d{font-size:11px;color:var(--muted)}
.bdg.locked{opacity:.35;filter:grayscale(1)}
.feed .lrow{padding:8px 2px;align-items:flex-start}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:4px;border-radius:2px;display:inline-block}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.swatch{border:2px solid var(--border);border-radius:14px;padding:10px;cursor:pointer;text-align:left;background:var(--panel)}
.swatch.on{border-color:var(--accent)}
.swatch .bars{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-bottom:6px}
.swatch .bars i{flex:1}
.review-step{display:flex;gap:14px}
.review-step .num{width:32px;height:32px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:700;flex-shrink:0;border:2px solid var(--border)}
.review-step.ok .num{background:var(--good);border-color:var(--good);color:#fff}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll-x{overflow-x:auto}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.emoji-pick{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.emoji-pick button{border:1px solid var(--border);background:var(--bg);border-radius:8px;cursor:pointer;font-size:17px;padding:2px 5px}

/* ============ Forms & Modal ============ */
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.fld .lb{font-size:12.5px;font-weight:650;color:var(--muted)}
.fld .hint{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=color],select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;outline:none;min-width:0}
input[type=color]{padding:2px;height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{min-height:70px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--bg);font-size:13.5px}
.checks label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.checks input{accent-color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px;margin-bottom:10px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
fieldset{border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 12px 2px;margin:0 0 12px;min-width:0}
legend{font-weight:650;font-size:13px;padding:0 6px}
.preview{background:var(--panel2);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;margin-bottom:12px}
#modal-root .bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;animation:fade .15s}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:20px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .18s;margin-bottom:5vh}
.modal.wide{max-width:860px}
.modal .m-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 10px}
.modal .m-h h2{font-size:19px;font-weight:700}
.modal .m-h .en{color:var(--muted);font-size:12.5px;margin-top:2px}
.modal .m-b{padding:8px 20px 6px}
.modal .m-f{display:flex;gap:8px;padding:12px 20px 18px;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:6px}
@media(max-width:600px){#modal-root .bg{padding:0;align-items:flex-end}.modal{border-radius:20px 20px 0 0;margin:0;max-height:94vh;overflow:auto}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
@media(max-width:899px){#toasts{bottom:84px;left:12px;right:12px;align-items:stretch}}
.toast{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;animation:pop .2s;pointer-events:auto;max-width:440px}
.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
.toast.celebrate{font-size:16px;border-left-color:var(--accent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,var(--panel)),var(--panel))}

  if (g.metric?.enabled) {

      body = `<div class="tiles" style="margin-bottom:8px">${tile('Tús · Start', `${num(m.start)} ${esc(m.unit)}`)}${tile('Anois · Now', `${num(i.metric.latest)} ${esc(m.unit)}`, `${i.metric.latest - m.start > 0 ? '+' : ''}${num(i.metric.latest - m.start)} ${esc(m.unit)}`, 't-acc')}${tile('Sprioc · Target', `${num(m.target)} ${esc(m.unit)}`, `${num(Math.abs(m.target - i.metric.latest))} to go`)}</div>

    } else {

        ${barChart({labels: weeks, series: ppl.map(pid => ({label: P(pid)?.name, color: P(pid)?.colour, values: weeks.map(w => weekTotal(g, pid, w))})), h: 200, fmt: v => num(v), xfmt: fmtDs, ref: {value: +m.weeklyTarget, label: 'Target', color: 'var(--good)'}})}

    h += `<div class="card">${cardH('Pota', 'Savings pot')}
      <div style="font-size:30px;font-weight:750">${money(i.money.saved)}</div><div class="small muted">of ${money(i.money.target)} target · in ${esc(A(g.pot.accountId)?.name || '—')}</div>
      ${pbar(i.money.frac, null, i.money.projFrac, done ? null : i.timeFrac, 'lg')}
      <dl class="kv" style="margin:10px 0"><dt>Projected by deadline</dt><dd class="${i.money.proj >= i.money.target ? 't-good' : 't-warn'}">${money0(i.money.proj)}</dd><dt>Still needed</dt><dd>${money0(Math.max(0, i.money.target - i.money.saved))}</dd><dt>Per month to hit it</dt><dd>${money0(i.money.perMonth)}</dd>${i.money.gap > 0 ? `<dt>Planned shortfall</dt><dd class="t-bad">${money0(i.money.gap)}</dd>` : ''}</dl>
      <div class="row-flex"><button class="btn primary sm" onclick="openPot('${g.id}',1)">+ Add money</button><button class="btn sm" onclick="openPot('${g.id}',-1)">− Take out</button><button class="btn sm" onclick="setupContribution('${g.id}')">↻ Regular saving</button></div>
      ${recs.length ? `<div class="grp-h" style="margin-top:14px">Regular contributions</div><div class="list">${recs.map(recRow).join('')}</div>` : ''}
      ${hist.length ? `<div class="grp-h" style="margin-top:14px">History</div><div class="list">${hist.slice(0, 12).map(x => `<div class="lrow" style="padding:6px 2px">${P(x.by) ? av(P(x.by), 'sm') : ''}<div class="grow small">${esc(x.note || (x.amount < 0 ? 'Taken out' : 'Added'))}<div class="tiny muted">${fmtDw(x.date)}</div></div><span class="amt small ${x.amount < 0 ? 't-bad' : 't-good'}">${x.amount < 0 ? '−' : '+'}${money(Math.abs(x.amount))}</span>${x.id ? `<button class="icon-btn" onclick="deleteTxn('${x.id}')">🗑</button>` : ''}</div>`).join('')}</div>` : ''}
    </div>`;
  }
  h += `<div class="card">${cardH('Gníomhaíocht', 'Related activity')}${(() => { const items = live('activity').filter(a => a.text.includes(g.title)).sort((a, b) => b.at.localeCompare(a.at)).slice(0, 10); return items.length ? `<div class="list feed">${items.map(a => `<div class="lrow">${av(P(a.by), 'sm')}<div class="grow small"><b>${esc(P(a.by)?.name || 'Dúchas')}</b> ${esc(a.text)}<div class="tiny muted">${timeAgo(a.at)}</div></div></div>`).join('')}</div>` : emptyBox('🌱', 'Nothing yet'); })()}</div>`;

VIEWS.projections = () => {
  const days = UI.projRange, pr = projection(days), accs = live('accounts'), sp = spareSuggestions();
  const savIds = accs.filter(a => a.type === 'savings').map(a => a.id), ccIds = accs.filter(a => a.type === 'credit').map(a => a.id);
  const step = days > 200 ? 3 : 1, idx = pr.dates.map((_, k) => k).filter(k => k % step === 0 || k === pr.dates.length - 1);
  const pick = arr => idx.map(k => arr[k]);
  let minI = 0; pr.liquid.forEach((v, k) => { if (v < pr.liquid[minI]) minI = k; });
  const series = [{label: 'Day-to-day', color: 'var(--accent)', values: pick(pr.liquid)}];
  if (savIds.length) series.push({label: 'Savings', color: 'var(--accent2)', values: pick(pr.dates.map((_, k) => sum(savIds, id => pr.per[id][k]))), area: false});
  if (ccIds.length && ccIds.some(id => pr.per[id].some(v => v !== 0))) series.push({label: 'Credit cards', color: 'var(--bad)', values: pick(pr.dates.map((_, k) => sum(ccIds, id => pr.per[id][k]))), area: false, dash: true});
  const flows = flowsByMonth(6, 6);
  const outEv = projection(30).events.filter(e => e.flow === 'out' && e.amt), byCat = {};
  outEv.forEach(e => { byCat[e.catId || ''] = (byCat[e.catId || ''] || 0) + e.amt; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]), catMax = Math.max(1, ...cats.map(c => c[1]));
  const goals = live('goals').filter(g => g.status !== 'done' && g.pot?.enabled).sort((a, b) => a.deadline.localeCompare(b.deadline));
  let h = secH('Réamh-mheas', 'Where your money is heading', tabsHtml([[90, '3 mo'], [180, '6 mo'], [365, '1 yr'], [730, '2 yrs']], days, "setUI.bind(null,'projRange')").replace('class="tabs"', 'class="tabs" style="margin:0"'));
  h += `<div class="tiles">${tile('Inniu · Today', money0(pr.liquid[0]), 'day-to-day balance')}${tile(`I gceann ${days < 365 ? days / 30 + ' mí' : days / 365 + ' bl'} · End`, money0(pr.liquid[pr.liquid.length - 1]), fmtD(pr.dates[pr.dates.length - 1]), pr.liquid[pr.liquid.length - 1] < 0 ? 't-bad' : '')}${tile('Íosphointe · Lowest point', money0(pr.liquid[minI]), fmtD(pr.dates[minI]), pr.liquid[minI] < (+S.settings.buffer || 0) ? 't-bad' : '')}${tile('Spártha · Safe to save now', money0(sp.sp.amount), `keeps ${money0(S.settings.buffer)} buffer for ${S.settings.spareDays} days`, 't-good')}</div>`;
  h += `<div class="card">${cardH('Iarmhéid', 'Projected balance')}${lineChart({labels: pick(pr.dates), series, refs: [{value: +S.settings.buffer || 0, label: 'Safety buffer', color: 'var(--warn)'}], marks: [{i: idx.indexOf(idx.reduce((best, k) => Math.abs(k - minI) < Math.abs(best - minI) ? k : best, 0)), v: pr.liquid[minI], color: 'var(--bad)', title: 'Lowest point'}], h: 260})}${legend(series.map(s => [s.color, s.label]).concat([['var(--warn)', 'Safety buffer']]))}
    <div class="tiny muted" style="margin-top:6px">Includes confirmed balances, upcoming bills &amp; income (variable ones predicted), remaining budgets and pot contributions.</div></div>`;
  h += `<div class="grid-2" style="margin-top:16px"><div class="card">${cardH('Isteach & Amach', 'Monthly income vs outgoings')}${barChart({labels: flows.map(f => f.m), series: [{label: 'Income', color: 'var(--good)', values: flows.map(f => f.in)}, {label: 'Outgoings', color: 'var(--bad)', values: flows.map(f => f.out)}], xfmt: fmtMon, dimmed: k => flows[k].proj, h: 240})}${legend([['var(--good)', 'Income'], ['var(--bad)', 'Outgoings'], ['var(--muted)', 'Faded = projected']])}</div>
    <div class="card">${cardH('Catagóirí', 'Next 30 days by category')}${cats.length ? cats.map(([cid, v]) => { const c = C(cid); return `<div class="hbar"><span class="ellipsis">${esc(c?.icon || '📦')} ${esc(c?.name || 'Other')}</span>${pbar(v / catMax, c?.colour)}<b class="nowrap">${money0(v)}</b></div>`; }).join('') + `<div class="hbar" style="border-top:1px solid var(--border);margin-top:6px;padding-top:8px"><b>Total</b><span></span><b>${money0(sum(cats, c => c[1]))}</b></div>` : emptyBox('📊', 'Add bills and budgets to see this')}</div></div>`;
  h += `<div class="grid-2" style="margin-top:16px"><div class="card">${cardH('Coigilt', 'Spare money suggestions')}
    ${sp.sp.amount <= 0 ? `<p class="small muted">No spare money right now. Your balance is projected to dip to ${money0(sp.sp.low)} on ${fmtD(sp.sp.lowDate)} (buffer ${money0(S.settings.buffer)}).</p>` : `<p class="small">You could safely move <b class="t-good">${money0(sp.sp.amount)}</b> towards goals now. Here's how it could be split, most urgent first:</p>`}
    ${sp.list.length ? `<div class="list">${sp.list.map(x => `<div class="lrow"><span class="g-ic sm">${esc(x.g.icon)}</span><div class="grow"><div class="ttl">${esc(x.g.title)}</div><div class="meta">gap ${money0(x.gap)} · due ${fmtDy(x.g.deadline)}</div></div><b>${money0(x.amount)}</b><button class="btn sm primary" onclick="openPot('${x.g.id}',1,${x.amount})">Move</button></div>`).join('')}</div>` : sp.sp.amount > 0 ? '<p class="small muted">All pots are on track. Nice! Consider a new goal or a bigger buffer.</p>' : ''}
  </div><div class="card">${cardH('Spriocanna', 'Goal pots on the timeline')}${goals.length ? `<div class="scroll-x"><table class="table"><tr><th>Goal</th><th>Deadline</th><th class="num">Saved</th><th class="num">Projected</th><th class="num">Target</th><th></th></tr>${goals.map(g => { const i = goalInfo(g); return `<tr onclick="go('goal/${g.id}')" style="cursor:pointer"><td>${esc(g.icon)} ${esc(g.title)}</td><td class="nowrap">${fmtDs(g.deadline)} ${g.deadline.slice(2, 4)}</td><td class="num">${money0(i.money.saved)}</td><td class="num">${money0(i.money.proj)}</td><td class="num">${money0(i.money.target)}</td><td>${pill(i.status)}</td></tr>`; }).join('')}</table></div>` : emptyBox('💰', 'No goal pots yet')}</div></div>`;
  h += `<div class="card" style="margin-top:16px">${cardH('Cuntais', 'Accounts', isAdmin() ? '<a class="btn sm" href="#/settings">Manage</a>' : '')}<div class="scroll-x"><table class="table"><tr><th>Account</th><th>Type</th><th class="num">Today</th><th class="num">Lowest</th><th class="num">At ${fmtDs(pr.dates[pr.dates.length - 1])}</th><th></th></tr>${accs.map(a => { const v = pr.per[a.id]; return `<tr><td><span class="dot" style="background:${esc(a.colour)}"></span> ${esc(a.name)} ${a.liquid ? '' : '<span class="tiny muted">(not day-to-day)</span>'}</td><td class="small muted">${esc(a.type)}</td><td class="num">${money(v[0])}</td><td class="num ${Math.min(...v) < 0 ? 't-bad' : ''}">${money0(Math.min(...v))}</td><td class="num">${money0(v[v.length - 1])}</td><td><button class="btn xs" onclick="openReconcile('${a.id}')">Set balance</button></td></tr>`; }).join('')}</table></div></div>`;
  return h;
};

  const key = reviewKey(), r = reviewRec(key), t = today();
  const od = dueItems(0).filter(i => i.due <= t);
  const buds = live('budgets').filter(b => b.active !== false);
  const goalsAct = live('goals').filter(g => g.status !== 'done');

  const lateSteps = goalsAct.flatMap(g => (g.steps || []).filter(s => !s.done && s.deadline && s.deadline <= addDays(t, 7)).map(s => ({g, s})));
  const weekly = goalsAct.filter(g => g.metric?.enabled);
  const sp = spareSuggestions(), people = loginPeople(), myDone = !!r.done?.[ME.id], m = Meta.get();
  const stepBox = (n, ok, ga, en, body) => `<div class="card review-step ${ok ? 'ok' : ''}"><span class="num">${ok ? '✓' : n}</span><div class="grow">${cardH(ga, en)}${body}</div></div>`;
  let h = secH('Athbhreithniú', `Weekly review · ${WD[dow(key)]} ${fmtD(key)}`, `<span class="pill ${myDone ? 'st-good' : 'st-warn'}">${myDone ? 'You signed off ✓' : 'Not signed off yet'}</span>`);
  h += `<p class="muted" style="margin-top:-8px">Sit down together for ten minutes and work through these. When you're both happy, each of you signs off for +${pts().review} points.</p><div class="stack">`;

/* =====================================================================
   FORMS & MODALS
   ===================================================================== */
function openModal({title, en = '', body, foot = '', wide = false, onMount}) {
  $('#modal-root').innerHTML = `<div class="bg" onmousedown="if(event.target===this)closeModal()"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="m-h"><div class="grow"><h2>${title}</h2>${en ? `<div class="en">${en}</div>` : ''}</div><button class="icon-btn" onclick="closeModal()" aria-label="Close">✕</button></div><div class="m-b">${body}</div>${foot ? `<div class="m-f">${Cloud.modalNote()}${foot}</div>` : ''}</div></div>`;
  const md = $('#modal-root .modal');
  md.addEventListener('input', formToggle); md.addEventListener('change', formToggle); formToggle();
  if (onMount) onMount(md);
  const f = $('#modal-root input:not([type=hidden]):not([type=checkbox]), #modal-root select, #modal-root textarea');
  if (f && innerWidth > 700) f.focus();
}
function closeModal() { $('#modal-root').innerHTML = ''; }
function formToggle() {
  $$('#modal-root [data-show]').forEach(e => {
    const [id, vs] = e.dataset.show.split('='), el = document.getElementById(id);
    const v = el ? (el.type === 'checkbox' ? String(el.checked) : el.value) : '';
    e.hidden = !vs.split('|').includes(v);
  });
}
const val = id => { const e = document.getElementById(id); return e ? (e.type === 'checkbox' ? e.checked : e.value.trim()) : ''; };
const checkedVals = name => $$(`#modal-root input[name="${name}"]:checked`).map(e => e.value);
const opt = (v, label, sel) => `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(label)}</option>`;
const fld = (label, inner, hint = '', extra = '') => `<div class="fld" ${extra}><span class="lb">${label}</span>${inner}${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
const inp = (id, value = '', type = 'text', attrs = '') => `<input type="${type}" id="${id}" value="${esc(value)}" ${type === 'number' ? 'step="any" inputmode="decimal"' : ''} ${attrs}>`;
const peopleChecks = (name, sel = [], list = live('people')) => `<div class="checks">${list.map(p => `<label><input type="checkbox" name="${name}" value="${p.id}" ${sel.includes(p.id) ? 'checked' : ''}> ${esc(p.icon)} ${esc(p.name)}</label>`).join('')}</div>`;
const accOpts = (sel, blank) => (blank ? opt('', blank, sel) : '') + live('accounts').map(a => opt(a.id, a.name, sel)).join('');
const personOpts = (sel, blank = '— nobody in particular —') => opt('', blank, sel) + live('people').map(p => opt(p.id, `${p.icon} ${p.name}`, sel)).join('');
function catOpts(kind, sel) {
  const ok = c => kind === 'in' ? c.kind !== 'out' : kind === 'out' ? c.kind !== 'in' : true;
  return live('categories').filter(ok).sort((a, b) => (a.kind === 'both') - (b.kind === 'both') || a.name.localeCompare(b.name)).map(c => opt(c.id, `${c.icon} ${c.name}`, sel)).join('');
}
function costFields(prefix, c = {type: 'none'}) {
  return `<div class="frow">${fld('Cost', `<select id="${prefix}-type">${opt('none', 'No cost / not sure', c.type)}${opt('estimate', 'Estimate (range)', c.type)}${opt('exact', 'Exact amount', c.type)}</select>`)}
    ${fld('From (€)', inp(prefix + '-min', c.min ?? '', 'number'), '', `data-show="${prefix}-type=estimate"`)}${fld('To (€)', inp(prefix + '-max', c.max ?? '', 'number'), '', `data-show="${prefix}-type=estimate"`)}
    ${fld('Amount (€)', inp(prefix + '-amt', c.amount ?? '', 'number'), '', `data-show="${prefix}-type=exact"`)}</div>`;
}
function costRead(prefix) {
  const type = val(prefix + '-type');
  if (type === 'estimate') { let lo = +val(prefix + '-min') || 0, hi = +val(prefix + '-max') || 0; if (hi < lo) [lo, hi] = [hi, lo]; return {type, min: lo, max: hi}; }
  if (type === 'exact') return {type, amount: +val(prefix + '-amt') || 0};
  return {type: 'none'};
}
function needAdmin() { if (isAdmin()) return true; toast('🔒 Only an admin can change this.', 'warn'); return false; }

/* ---------------- Save pipeline ---------------- */
function save(skipRender) {
  VER++; MEMO.clear();
  Meta.set({lastChange: nowISO()});
  checkBadges();
  Store.save(S);
  if (!skipRender) render(); else renderChrome();
}
function checkBadges() {
  if (!ME) return;
  for (const b of earnedBadges(ME.id)) {
    const id = ME.id + ':' + b[0];
    if (S.badgesSeen.some(x => x.id === id)) continue;
    S.badgesSeen.push({id, at: nowISO(), updatedAt: nowISO()});
    logAct(b[1], `earned the “${b[2]}” badge`);
    setTimeout(() => celebrate(`New badge: ${b[1]} <b>${esc(b[2])}</b> · ${esc(b[3])}`), 500);
  }
}

/* ---------------- Confirm bills / income ---------------- */
function openConfirm(occKey) {
  const at = occKey.lastIndexOf('@'), recId = occKey.slice(0, at), nominal = occKey.slice(at + 1), r = R(recId);
  if (!r) return;
  const due = shiftDate(nominal, r.schedule.shift), pred = predict(r, nominal), t = today(), isIn = r.kind === 'in';
  const hist = paidHistory(r.id).slice(-4).reverse();
  const verb = isIn ? 'received' : r.kind === 'out' ? 'paid' : 'done';
  openModal({
    title: isIn ? 'Dearbhaigh · Confirm received' : 'Dearbhaigh · Confirm paid', en: esc(r.name),
    body: `<div class="row-flex" style="margin-bottom:14px;flex-wrap:nowrap">${catIc(C(r.categoryId))}<div class="grow"><div class="b">${esc(r.name)}</div><div class="small muted">Due ${fmtDw(due)} · ${esc(describeSched(r.schedule))}</div></div></div>
      <div class="preview">${r.amountType === 'variable' ? `Predicted <b>${money(pred.amount)}</b> <span class="muted">(${esc(pred.basis)})</span>. Change it if the actual amount differs.` : `Fixed amount <b>${money(pred.amount)}</b>`}${hist.length ? `<div class="tiny muted" style="margin-top:4px">Previous: ${hist.map(o => `${fmtDs(o.nominal)} ${money(o.amount)}`).join(' · ')}</div>` : ''}</div>
      <div class="frow">${fld('Amount (€)', inp('f-amt', pred.amount, 'number'))}${fld(`Date ${verb}`, inp('f-date', minD(due, t), 'date'))}</div>
      ${fld(r.kind === 'in' ? 'Into account' : 'From account', `<select id="f-acc">${accOpts(r.accountId)}</select>`)}
      ${fld('Note (optional)', inp('f-note', ''))}
      <div class="small ${t <= addDays(due, 1) ? 't-good' : 'muted'}">${t <= addDays(due, 1) ? `⏱️ Confirming on time: +${pts().onTime} points` : `Late confirmation: +${pts().late} points. Confirm on the day to keep your streak!`}</div>`,
    foot: `<button class="btn ghost" onclick="doConfirm('${occKey}','skipped')">Skip this one</button><span class="sp"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doConfirm('${occKey}','paid')">✓ Confirm ${verb}</button>`,
  });
}
function doConfirm(occKey, status) {
  const at = occKey.lastIndexOf('@'), recId = occKey.slice(0, at), nominal = occKey.slice(at + 1), r = R(recId);
  if (!r) return;
  const due = shiftDate(nominal, r.schedule.shift), amt = round2(+val('f-amt'));
  if (status === 'paid' && !(amt >= 0 && val('f-amt') !== '')) return toast('Please enter the amount', 'warn');
  const onTime = today() <= addDays(due, 1), goalBefore = r.goalId && G(r.goalId) ? goalSaved(G(r.goalId)) : 0;
  upsert('occ', {id: occKey, recId, nominal, due, status, amount: status === 'paid' ? amt : 0, date: val('f-date') || today(), accountId: val('f-acc') || r.accountId, note: val('f-note'), by: ME.id, onTime: status === 'paid' && onTime});
  closeModal();
  if (status === 'paid') {
    const p = award(ME.id, onTime ? pts().onTime : pts().late, `${onTime ? 'On time' : 'Late'}: ${r.name}`, 'occ:' + occKey);
    let bonus = 0;
    if (onTime) {
      const st = onTimeStreak(ME.id);
      if (st && st % 25 === 0) bonus = award(ME.id, pts().streak25, `🔥 ${st} on time in a row`, 'occ:' + occKey + ':streak');
      else if (st && st % 10 === 0) bonus = award(ME.id, pts().streak10, `🔥 ${st} on time in a row`, 'occ:' + occKey + ':streak');
      else if (st && st % 5 === 0) bonus = award(ME.id, pts().streak5, `🔥 ${st} on time in a row`, 'occ:' + occKey + ':streak');
      if (bonus) setTimeout(() => celebrate(`🔥 ${st} on time in a row! +${bonus} bonus points`), 300);
    }
    logAct(r.kind === 'in' ? '💶' : '✅', `${r.kind === 'in' ? 'received' : 'confirmed'} ${r.name} · ${money(amt)}${onTime ? '' : ' (late)'}`);
    toast(`✅ <b>${esc(r.name)}</b> confirmed · +${p} points`, 'good');
    const g = G(r.goalId);
    if (g) { VER++; MEMO.clear(); if (goalBefore < g.pot.target && goalSaved(g) >= g.pot.target) setTimeout(() => celebrate(`${esc(g.icon)} <b>${esc(g.title)}</b> pot is fully funded!`), 600); }
  } else {
    logAct('⏭️', `skipped ${r.name} for ${fmtDs(due)}`);

  }
  save();
}

function saveGoal(id) {

  if (val('f-met') && val('f-mmode') === 'reach' && (val('f-mstart') === '' || val('f-mtarget') === '')) return toast('Enter starting and target values', 'warn');
  if (val('f-met') && val('f-mmode') === 'weekly' && !(+val('f-mweekly') > 0)) return toast('Enter a weekly target', 'warn');

    steps: old?.steps || [], status: old?.status || 'active'});
  logAct('🎯', `${id ? 'updated' : 'created'} goal “${title}”`);
  closeModal(); save();

}
function deleteGoal(id) { const g = G(id); if (!g || !confirm(`Delete goal "${g.title}"?`)) return; softDelete('goals', id); logAct('🗑️', `deleted goal “${g.title}”`); save(true); go('goals'); }
function completeGoal(id) {

function reopenGoal(id) { const g = G(id); if (!g) return; upsert('goals', {...g, status: 'active', doneAt: '', doneBy: ''}); unaward('goal:' + id); logAct('↩️', `reopened “${g.title}”`); save(); }

function saveStep(gid, sid) {

function deleteStep(gid, sid) { const g = G(gid); if (!confirm('Delete this step?')) return; upsert('goals', {...g, steps: g.steps.filter(s => s.id !== sid)}); unaward('step:' + sid); closeModal(); save(); }
function toggleStep(gid, sid) {
  const g = G(gid); if (!g) return;
  const steps = g.steps.map(s => s.id === sid ? {...s, done: !s.done, doneAt: !s.done ? nowISO() : '', doneBy: !s.done ? ME.id : ''} : s);
  const s = steps.find(x => x.id === sid);
  upsert('goals', {...g, steps});

    const p = award(ME.id, pts().step, 'Step: ' + s.title, 'step:' + sid);
    logAct('✔️', `ticked off “${s.title}” (${g.title})`);
    toast(`✔️ <b>${cheer()}</b> +${p} points`, 'good');
  } else unaward('step:' + sid);
  save();
  if (s.done && g.status !== 'done' && steps.every(x => x.done)) {
    openModal({title: '🎉 Gach céim déanta!', en: 'All steps done', body: `<p>Every step of <b>${esc(g.title)}</b> is complete. Mark the whole goal as done for +${pts().goal} points${(g.ownerIds || []).length > 1 ? ' each' : ''}?</p>`, foot: `<span class="sp"></span><button class="btn" onclick="closeModal()">Not yet</button><button class="btn primary" onclick="completeGoal('${gid}')">🏁 Complete goal</button>`});
  }
}
function openMetric(gid) {
  const g = G(gid), m = g.metric, ppl = metricPeople(g), wk = m.mode === 'weekly';
  openModal({

    body: `<div class="frow">${fld('Who', `<select id="f-pid">${ppl.map(pid => opt(pid, `${P(pid)?.icon} ${P(pid)?.name}`, ppl.includes(ME.id) ? ME.id : ppl[0])).join('')}</select>`)}${fld('Date', inp('f-date', today(), 'date'))}</div>

      ${fld('Note (optional)', inp('f-note', ''))}`,

function saveMetric(gid) {
  const g = G(gid), m = g.metric, v = +val('f-val'), pid = val('f-pid'), date = val('f-date') || today();
  if (val('f-val') === '' || !isFinite(v)) return toast('Please enter a number', 'warn');
  const prev = metricLogs(g).filter(l => l.personId === pid).pop();
  upsert('metrics', {id: uid('m'), goalId: gid, personId: pid, date, value: v, note: val('f-note')});
  logAct('📏', `logged ${num(v)} ${m.unit} for ${g.title}${pid !== ME.id ? ` (for ${P(pid)?.name})` : ''}`);
  closeModal();
  if (m.mode === 'weekly') {
    const w = weekStartOf(date), tot = weekTotal(g, pid, w);
    const p = tot >= m.weeklyTarget ? award(pid, pts().metricWeek, `${g.title}: weekly target hit`, `mw:${gid}:${pid}:${w}`) : 0;
    save();
    if (p) celebrate(`${esc(P(pid)?.name)} hit ${num(m.weeklyTarget)} ${esc(m.unit)} this week! +${p} points`);
    else toast(`📊 ${num(tot)} / ${num(m.weeklyTarget)} ${esc(m.unit)} this week${tot < m.weeklyTarget ? ` · ${num(m.weeklyTarget - tot)} to go` : ''}`, 'good');
  } else {
    save();
    const down = m.target < m.start, reached = down ? v <= m.target : v >= m.target;
    if (reached) celebrate(`Target of ${num(m.target)} ${esc(m.unit)} reached for <b>${esc(g.title)}</b>!`);
    else { const moved = v - m.start; toast(`📏 ${moved === 0 ? 'Logged' : `${moved > 0 ? '+' : ''}${num(moved)} ${esc(m.unit)} since the start`}${prev && (down ? v < prev.value : v > prev.value) ? `. Going the right way! ${cheer()}` : ''}`, 'good'); }
  }
}
function deleteMetric(id) { if (!confirm('Delete this entry?')) return; softDelete('metrics', id); save(); }
function openPot(gid, dir = 1, amount = '') {
  const g = G(gid); if (!g?.pot?.enabled) return;

      ${fld('Note (optional)', inp('f-note', ''))}`,
    foot: `<span class="sp"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePot('${gid}',${dir})">${dir > 0 ? '+ Add' : '− Take out'}</button>`,

function savePot(gid, dir) {
  const g = G(gid), amt = round2(+val('f-amt')); if (!(amt > 0)) return toast('Please enter an amount', 'warn');
  const before = goalSaved(g), id = uid('tx');
  upsert('txns', {id, kind: 'pot', goalId: gid, accountId: val('f-from'), toAccountId: g.pot.accountId, amount: dir * amt, date: val('f-date') || today(), note: val('f-note'), by: ME.id});
  const p = dir > 0 ? award(ME.id, pts().potAdd, `Added to ${g.title}`, 'tx:' + id) : 0;
  logAct(dir > 0 ? '💰' : '💸', `${dir > 0 ? 'added' : 'took'} ${money(amt)} ${dir > 0 ? 'to' : 'from'} the ${g.title} pot`);
  closeModal(); save();
  const after = goalSaved(g);
  if (dir > 0 && before < g.pot.target && after >= g.pot.target) celebrate(`${esc(g.icon)} <b>${esc(g.title)}</b> pot is fully funded!`);
  else toast(dir > 0 ? `💰 ${money0(after)} of ${money0(g.pot.target)} saved · +${p} points` : `Pot now ${money0(after)}`, 'good');
}

/* ---------------- Weekly review ---------------- */
function saveReviewNotes() {
  const key = reviewKey(), r = reviewRec(key);
  upsert('reviews', {...r, week: key, notes: val('rv-notes'), actions: val('rv-actions')});
  save(true); toast('Notes saved', 'good', 1500);
}
function signOff() {
  const key = reviewKey(), r = reviewRec(key);
  upsert('reviews', {...r, week: key, notes: val('rv-notes') || r.notes, actions: val('rv-actions') || r.actions, done: {...(r.done || {}), [ME.id]: nowISO()}});
  const p = award(ME.id, pts().review, 'Weekly review', 'rv:' + key);
  VER++; MEMO.clear();
  const st = reviewStreak(ME.id); let bonus = 0;
  if (st && st % 4 === 0) bonus = award(ME.id, pts().reviewStreak4, `${st}-week review streak`, 'rvs:' + key);
  logAct('🗓️', 'signed off the weekly review');
  save();
  const all = loginPeople().every(pp => reviewRec(key).done?.[pp.id]);
  celebrate(all ? `Le chéile! Everyone has signed off this week's review. +${p + bonus} points` : `Review signed off · +${p + bonus} points${bonus ? ` (incl. ${st}-week streak bonus!)` : ''}`);
}

  });
}
function saveCategory(id) { if (!needAdmin()) return; const name = val('f-name'); if (!name) return toast('Name please', 'warn'); upsert('categories', {id: id || uid('cat'), name, icon: val('f-icon') || '📦', colour: val('f-col'), kind: val('f-ck')}); closeModal(); save(); }
function deleteCategory(id) { if (!needAdmin()) return; if (!confirm('Delete this category? Items using it will show as uncategorised.')) return; softDelete('categories', id); closeModal(); save(); }
function saveGeneral() {
  if (!needAdmin()) return;
  S.settings = {...S.settings, motto: val('s-motto'), reviewDay: +val('s-rday'), weekStart: +val('s-wstart'), prediction: val('s-pred'), buffer: +val('s-buffer') || 0, spareDays: Math.max(7, +val('s-spare') || 60), horizons: {short: +val('s-hs') || 3, medium: +val('s-hm') || 12}, updatedAt: nowISO()};
  logAct('⚙️', 'updated general settings'); save(); toast('Settings saved', 'good');
}
function savePoints() {
  if (!needAdmin()) return;
  const p = {}; for (const k of Object.keys(POINT_LABELS)) p[k] = Math.max(0, Math.round(+val('pt-' + k) || 0));
  S.settings = {...S.settings, points: p, updatedAt: nowISO()}; logAct('⭐', 'updated the points rules'); save(); toast('Points rules saved', 'good');
}

/* ---------------- Import / export ---------------- */
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `duchas-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  Meta.set({lastExport: nowISO()}); renderChrome();
  toast(`💾 Saved <b>duchas-${today()}.json</b>. Open Dúchas on the other device and use <b>Load &amp; merge</b>.`, 'good', 6000);
}
function importData() { const fi = $('#file-input'); fi.value = ''; fi.click(); }
async function handleImportFile(file) {
  let inc; try { inc = JSON.parse(await file.text()); } catch { return toast('That file is not valid JSON', 'bad'); }
  if (inc && inc.app === 'duchas') {
    const counts = COLLS.filter(k => (inc[k] || []).length).map(k => `${(inc[k] || []).filter(x => !x.deleted).length} ${k}`).join(', ');
    window.__pendingImport = inc;
    openModal({title: 'Lódáil · Load data', en: esc(file.name), body: `<p class="small">This file contains: <span class="muted">${esc(counts) || 'nothing'}</span>.</p><p class="small"><b>Merge</b> (recommended) combines it with this device. For every item the most recently changed version wins, so nothing is lost.</p>${isAdmin() ? '<p class="small muted"><b>Replace</b> throws away everything on this device and uses the file instead.</p>' : ''}`,
      foot: `${isAdmin() ? '<button class="btn danger" onclick="doImport(true)">Replace everything</button>' : ''}<span class="sp"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doImport(false)">🔄 Merge</button>`});
  } else if (inc && (inc.data?.vanTasks || inc.data?.repairs || inc.vanTasks)) {
    if (!needAdmin()) return;
    if (!confirm('This looks like the original roadmap file. Import its savings pots, projects and tasks as goals?')) return;
    const sd = convertRoadmap(inc.data || inc); sd.goals.forEach(g => S.goals.push(g)); sd.metrics.forEach(m => S.metrics.push(m));
    logAct('📥', `imported ${sd.goals.length} goals from the roadmap file`); save(); go('goals'); toast(`Imported ${sd.goals.length} goals`, 'good');
  } else toast("That doesn't look like a Dúchas file", 'bad');
}
function doImport(replace) {
  const inc = window.__pendingImport; if (!inc) return; closeModal();
  if (replace) {
    if (!needAdmin() || !confirm('Replace ALL data on this device with the file?')) return;
    S = normalise(structuredClone(inc)); VER++; MEMO.clear(); Store.save(S);
    ME = P(ME.id); if (!ME) return logout();
    Meta.set({lastImport: nowISO()}); render(); toast('Data replaced from file', 'good');
  } else {
    const {added, updated} = applyMerge(inc);
    Meta.set({lastImport: nowISO()});
    if (added || updated) { logAct('🔄', `merged a data file (${added} new, ${updated} updated)`); save(); }
    toast(added || updated ? `🔄 Merged: <b>${added}</b> new, <b>${updated}</b> updated` : 'Already up to date. Nothing new in that file.', 'good', 5000);
  }
  window.__pendingImport = null;
}
function reseedRoadmap() {
  if (!needAdmin() || !confirm('Add the goals from your original roadmap again? (Existing goals are kept.)')) return;
  const sd = convertRoadmap(ROADMAP_SEED); sd.goals.forEach(g => S.goals.push(g)); logAct('📥', 're-imported roadmap goals'); save(); go('goals');
}
function resetAll() {
  if (!needAdmin()) return;
  if (prompt('This deletes ALL Dúchas data in this browser. Save a copy first!\n\nType RESET to continue.') !== 'RESET') return;
  localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_META); localStorage.removeItem(LS_SESSION); location.hash = ''; location.reload();
}

/* =====================================================================
   LOGIN & STARTUP
   ===================================================================== */
function showLogin() {
  document.documentElement.dataset.theme = localStorage.getItem(LS_THEME) || 'oiche';
  $('#app').hidden = true; const L = $('#login'); L.hidden = false;
  const hr = new Date().getHours();
  L.innerHTML = `<div class="login-box"><div class="logo">🌳</div><h1>Dúchas</h1><div class="muted">${hr < 12 ? 'Maidin mhaith' : hr < 18 ? 'Dia duit' : 'Tráthnóna maith'}! Fáilte abhaile · Welcome home</div>
    <div class="who">${loginPeople().map(p => `<button style="--c:${esc(p.colour)}" onclick="pickLogin('${p.id}')" id="who-${p.id}">${av(p, 'lg')}<span class="nm">${esc(p.name)}</span><span class="tiny muted">${p.role === 'admin' ? 'Admin' : 'Member'}${p.pinHash ? ' · 🔒' : ''}</span></button>`).join('')}</div>
    <div id="pin-area"></div>
    <p class="tiny muted" style="margin-top:30px">${Cloud.loginNote()}</p></div>`;
}
function pickLogin(pid) {
  const p = P(pid); $$('.who button').forEach(b => b.classList.toggle('on', b.id === 'who-' + pid));
  if (!p.pinHash) return doLogin(pid);
  $('#pin-area').innerHTML = `<div class="pin-row"><input type="password" inputmode="numeric" id="pin" placeholder="PIN" autocomplete="off" onkeydown="if(event.key==='Enter')tryPin('${pid}')"><button class="btn primary" onclick="tryPin('${pid}')">Isteach · Go</button></div><div id="pin-err" class="small t-bad" style="margin-top:8px"></div>`;
  $('#pin').focus();
}
function tryPin(pid) { if (hashPin($('#pin').value, pid) === P(pid).pinHash) doLogin(pid); else { $('#pin-err').textContent = 'Wrong PIN. Try again.'; $('#pin').value = ''; $('#pin').focus(); } }
function doLogin(pid) {
  ME = P(pid); localStorage.setItem(LS_SESSION, pid); applyTheme();
  $('#login').hidden = true; $('#app').hidden = false;
  checkBadges(); if (!location.hash || location.hash === '#') location.hash = '#/home';
  render();
  if (!ME.pinHash) setTimeout(() => toast('Tip: set a PIN (top-right menu) so nobody logs in as you by accident.', '', 6000), 800);
}
function logout() { ME = null; localStorage.removeItem(LS_SESSION); closeModal(); showLogin(); }

function init() {
  S = Store.load();
  if (!S) {
    S = defaultDoc();
    const sd = convertRoadmap(ROADMAP_SEED);
    S.goals.push(...sd.goals); S.metrics.push(...sd.metrics); S.settings.motto = sd.motto;
    S.activity.push({id: uid('act'), at: nowISO(), by: '', icon: '🌱', text: 'set up with goals from your roadmap. Fáilte!', updatedAt: nowISO()});
    Store.save(S);
  }
  window.addEventListener('hashchange', () => { closeModal(); render(); });
  $('#file-input').addEventListener('change', e => { const f = e.target.files[0]; if (f) handleImportFile(f); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  window.addEventListener('storage', e => { if (e.key === LS_KEY && e.newValue) { S = normalise(JSON.parse(e.newValue)); VER++; MEMO.clear(); if (ME) { ME = P(ME.id) || ME; render(); } } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ME) { VER++; MEMO.clear(); render(); } });
  const sid = localStorage.getItem(LS_SESSION), p = sid && P(sid);
  if (p && p.role !== 'none') doLogin(sid); else showLogin();
}
Cloud.boot(init); // Google sign-in and Drive first, then the app as before
</script>
</body>
